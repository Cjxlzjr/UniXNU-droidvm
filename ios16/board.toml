schema_version = 2

[board]
name = "droidvm-ios16"
description = "DroidVM iPhone X iOS 16 kernel bring-up (crosvm on Gunyah)"
soc = "crosvm-gunyah"
soc_source = "crosvm-gunyah"
os_profile = "ios-16.7.16-20H392"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]

[kernel]
defconfig = "droidvm_ios16_defconfig"
config_fragments = ["arch:configs/common.config"]
patch_series = ["device:patches/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
# Darwin 22's makedefs do not emit a separate .noctf executable.
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
# The APFS root uses the Darwin 22 VFS export in patches/series.
# Mobile graphics has a separate ABI qualification.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOHIDEventDriver",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[payload]
volume = "IOS16PROBE"
size_mib = 128
loader = "driver"
title = "DroidVM: iPhone X iOS 16 kernel probe"
dram_size = "0x13fa00000"
kernel_args = ["debug=0x10a", "serial=3", "-v", "keepsyms=1", "armcpu-diagnostics=1"]

[payload.adt]
tool = "scripts/make-droidvm-adt.py"
dram_base = "0x80600000"
owned_memory_size = "0x20000000"
tool_args = ["--dynamic", "--fdt", "build/crosvm-gunyah.dtb", "--identity-tree", "build/iphone-x-identity.im4p",
             "--reclaim-memory", "--boot-video-mib", "8", "--display-gamut", "sRGB"]
