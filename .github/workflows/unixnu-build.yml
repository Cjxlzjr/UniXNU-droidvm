name: UniXNU Staged Build (macOS)

on:
  push:
    branches:
      - wip/hackintosh
    paths:
      - 'ci/dispatch-images/**'
  workflow_dispatch:
    inputs:
      stage:
        description: "Build through this step (plugin only checks graphics; images builds the complete iPadOS 17 release)"
        type: choice
        options:
          - setup
          - kernel
          - package
          - plugin
          - images
        default: images
        required: true
      export_recipient:
        description: "Public age recipient (age1…); required for images, optional for kernel"
        type: string
        required: false
        default: "age16wv2hcp4sktjexht8je05qwneyq2ddsxwt4nzhy90tz4h7zs0d3sftv9gs"

permissions:
  contents: read

concurrency:
  group: unixnu-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build through ${{ inputs.stage || 'images' }}"
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      STAGE: ${{ inputs.stage || 'images' }}
      EXPORT_RECIPIENT: ${{ inputs.export_recipient || 'age16wv2hcp4sktjexht8je05qwneyq2ddsxwt4nzhy90tz4h7zs0d3sftv9gs' }}
      GH_TOKEN: ${{ github.token }}
      UNIXNU_REVISION: dba62c1ca53cd04c25b0e501afff31d5ffe2e20e
      # Matches cargo +1.98.0 in UniXNU scripts/build-adreno-metal-bridge.py at UNIXNU_REVISION.
      BRIDGE_RUST_VERSION: "1.98.0"
      BRIDGE_RUST_TARGET: aarch64-apple-ios
    steps:
      - name: Check out device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld cmake ninja unifdef mtools dtc
          if [[ "$STAGE" == images || "$STAGE" == plugin ]]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup toolchain install "$BRIDGE_RUST_VERSION" --profile minimal --target "$BRIDGE_RUST_TARGET"
            printf "pub fn probe() -> std::vec::Vec<u8> { std::vec::Vec::new() }\n" | \
              rustc "+$BRIDGE_RUST_VERSION" --target "$BRIDGE_RUST_TARGET" --crate-name bridge_sdk_probe \
                --crate-type lib --emit metadata -o "$RUNNER_TEMP/bridge_sdk_probe.rmeta" -
            brew install bison flex glslang gnu-sed pkgconf vulkan-headers shaderc spirv-tools
            command -v glslc
            glslc --version
            command -v spirv-val
            spirv-val --version
            test -s /opt/homebrew/include/vulkan/vulkan.h || { echo '::error::Homebrew Vulkan headers were not linked into /opt/homebrew/include'; exit 1; }
            printf '#include <vulkan/vulkan.h>\nint main(void) { return VK_SUCCESS; }\n' | xcrun clang -x c -std=c11 -I/opt/homebrew/include -fsyntax-only -
            xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -std=c11 \
              -D_POSIX_C_SOURCE=200809L -D_DARWIN_C_SOURCE -Werror \
              -dynamiclib -Wl,-undefined,dynamic_lookup -Wl,-fixup_chains \
              -o "$RUNNER_TEMP/darwin-sdk-probe.dylib" -x c - <<'C'
          #include <machine/endian.h>
          #include <dlfcn.h>
          #if !defined(__DARWIN_BYTE_ORDER) || __DARWIN_BYTE_ORDER != __DARWIN_LITTLE_ENDIAN
          #error "The SDK did not declare Darwin's ARM64 byte order"
          #endif
          int probe(const void *address) {
              Dl_info info;
              return dladdr(address, &info);
          }
          extern void optional_entrypoint(void) __attribute__((weak_import));
          void (*probe_weak_import)(void) = optional_entrypoint;
          C
            xcrun otool -l "$RUNNER_TEMP/darwin-sdk-probe.dylib" | grep -F LC_DYLD_CHAINED_FIXUPS
          fi
          if [[ -n "$EXPORT_RECIPIENT" || "$STAGE" == images ]]; then
            if [[ ! "$EXPORT_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]; then
              echo '::error::Provide an age 1 public recipient to export artifacts.'
              exit 1
            fi
            brew install age
            printf '' | age --encrypt --recipient "$EXPORT_RECIPIENT" >/dev/null
          fi
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          df -h / /private/tmp

      - name: Clone UniXNU and submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch wip/hackintosh https://github.com/Droid-VM/UniXNU.git UniXNU
          git -C UniXNU checkout --detach "$UNIXNU_REVISION"
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          echo "UniXNU commit: $(git -C UniXNU rev-parse HEAD)"
          echo "Device commit: $(git -C device rev-parse HEAD)"

      - name: List staged build steps
        shell: bash
        run: |
          set -euo pipefail
          python3 device/scripts/build-droidvm-all.py --list
          case "$STAGE" in
            setup|kernel|package|plugin|images) ;;
            *) echo "::error::Unsupported stage: $STAGE"; exit 1 ;;
          esac

      - name: Identify reusable package outputs
        if: ${{ github.ref == 'refs/heads/wip/hackintosh' && (env.STAGE == 'package' || env.STAGE == 'images') }}
        id: package_key
        env:
          CHECKPOINT_IDENTITY: ${{ secrets.UNIXNU_CHECKPOINT_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CHECKPOINT_IDENTITY" ]]; then
            echo '::notice::Package checkpoint is disabled without UNIXNU_CHECKPOINT_IDENTITY.'
            exit 0
          fi
          fingerprint=$({
            printf "%s\n" "$UNIXNU_REVISION" "$RUNNER_OS" "$RUNNER_ARCH"
            printf "%s\n" "$CHECKPOINT_IDENTITY" | age-keygen -y
            git -C device ls-tree -r HEAD -- board.toml configs feeds.toml package scripts socs ci/package-checkpoint.py
            sw_vers -productVersion
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-build-version
            python3 --version
            brew list --versions llvm lld cmake ninja unifdef mtools dtc
          } | shasum -a 256 | cut -d " " -f 1)
          echo "key=unixnu17-package-$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Fetch encrypted package checkpoint
        if: ${{ steps.package_key.outputs.key != '' }}
        id: package_cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.package_key.outputs.key }}
          path: ${{ runner.temp }}/unixnu-package.tar.gz.age

      - name: Restore verified package outputs
        if: ${{ steps.package_cache.outputs.cache-hit == 'true' }}
        env:
          CHECKPOINT_IDENTITY: ${{ secrets.UNIXNU_CHECKPOINT_IDENTITY }}
          CHECKPOINT_KEY: ${{ steps.package_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p diagnostics
          python3 device/scripts/build-droidvm-all.py --to setup 2>&1 | tee diagnostics/build-setup.log
          archive="$RUNNER_TEMP/unixnu-package.tar.gz"
          trap 'rm -f "$archive"' EXIT
          if age --decrypt --identity <(printf "%s\n" "$CHECKPOINT_IDENTITY") \
                  -o "$archive" "$RUNNER_TEMP/unixnu-package.tar.gz.age" && \
             python3 device/ci/package-checkpoint.py restore UniXNU/out/droidvm "$CHECKPOINT_KEY" --archive "$archive"; then
            echo 'Restored matching kernel, EFI loaders and their Data seed.'
          else
            echo '::warning::Package checkpoint could not be restored; building the missing stages.'
          fi

      - name: Build selected stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [[ "$STAGE" == plugin ]]; then
            python3 device/scripts/build-droidvm-all.py --only plugin 2>&1 | tee diagnostics/build.log
            exit 0
          fi
          first_stage=$STAGE
          if [[ "$first_stage" == images ]]; then first_stage=package; fi
          echo "Starting UniXNU build through: $first_stage"
          python3 device/scripts/build-droidvm-all.py --to "$first_stage" 2>&1 | tee diagnostics/build.log

      - name: Check kernel output
        if: ${{ success() && (env.STAGE == 'kernel' || env.STAGE == 'package' || env.STAGE == 'images') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s UniXNU/out/droidvm/kernel/kernel.macho
          ls -lh UniXNU/out/droidvm/kernel/kernel.macho
          file UniXNU/out/droidvm/kernel/kernel.macho | tee diagnostics/kernel-format.txt
          grep -Fq 'Mach-O 64-bit executable arm64' diagnostics/kernel-format.txt
          shasum -a 256 UniXNU/out/droidvm/kernel/kernel.macho

      - name: Check UEFI loaders
        if: ${{ success() && (env.STAGE == 'package' || env.STAGE == 'images') }}
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU/out/droidvm/package/Build/Out/AARCH64-DEBUG
          for loader in UniXNU.efi DarwinBoot.efi; do
            test -s "$loader"
            file "$loader"
            shasum -a 256 "$loader"
          done

      - name: Encrypt successful package checkpoint
        if: ${{ success() && steps.package_key.outputs.key != '' && steps.package_cache.outputs.cache-hit != 'true' }}
        id: pack_package
        continue-on-error: true
        env:
          CHECKPOINT_IDENTITY: ${{ secrets.UNIXNU_CHECKPOINT_IDENTITY }}
          CHECKPOINT_KEY: ${{ steps.package_key.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          recipient=$(printf "%s\n" "$CHECKPOINT_IDENTITY" | age-keygen -y)
          python3 device/ci/package-checkpoint.py save UniXNU/out/droidvm "$CHECKPOINT_KEY" | \
            age --encrypt --recipient "$recipient" -o "$RUNNER_TEMP/unixnu-package.tar.gz.age"

      - name: Save verified package checkpoint before image assembly
        if: ${{ steps.pack_package.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.package_key.outputs.key }}
          path: ${{ runner.temp }}/unixnu-package.tar.gz.age

      - name: Encrypt kernel artifact (optional)
        if: ${{ success() && (env.STAGE == 'kernel' || env.STAGE == 'images') }}
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EXPORT_RECIPIENT" ]]; then
            tar -czf - -C UniXNU/out/droidvm kernel | \
              age --encrypt --recipient "$EXPORT_RECIPIENT" -o "$RUNNER_TEMP/unixnu-kernel.tar.gz.age"
          elif [ -z "$ARTIFACT_KEY" ]; then
            echo "::notice::Set repository secret ARTIFACT_KEY to export an encrypted kernel; no binary uploaded."
            exit 0
          else
            tar -czf - -C UniXNU/out/droidvm kernel | \
              openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY \
                -out "$RUNNER_TEMP/unixnu-kernel.tar.gz.enc"
          fi
          echo "Encrypted kernel ready."

      - name: Upload encrypted kernel
        if: ${{ success() && (env.STAGE == 'kernel' || env.STAGE == 'images') }}
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel-encrypted-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/unixnu-kernel.tar.gz.age
            ${{ runner.temp }}/unixnu-kernel.tar.gz.enc
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Build release images
        if: ${{ success() && env.STAGE == 'images' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNIXNU_UNIQUE_CHIP_ID="$(openssl rand -hex 8)"
          printf '%s\n' "$UNIXNU_UNIQUE_CHIP_ID" > "$RUNNER_TEMP/unique-chip-id.txt"
          echo "::add-mask::$UNIXNU_UNIQUE_CHIP_ID"
          export UNIXNU_UNIQUE_CHIP_ID
          python3 device/scripts/build-droidvm-all.py --to images 2>&1 | \
            perl -pe 'BEGIN { $| = 1 } s/\Q$ENV{UNIXNU_UNIQUE_CHIP_ID}\E/[platform seed]/g' | tee diagnostics/build-images.log

      - name: Verify and encrypt release
        if: ${{ success() && env.STAGE == 'images' }}
        shell: bash
        run: |
          set -euo pipefail
          release=UniXNU/out/droidvm/release
          python3 - "$release" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          release = Path(sys.argv[1])
          files = json.loads((release / 'release.json').read_text())['files']
          expected = {'droidvm-disk.img', 'kernel.macho', 'os.img', 'systemos.img'}
          if files.keys() != expected:
              sys.exit(f'Unexpected release files: {sorted(files)}')
          for name, record in files.items():
              path = release / name
              size = path.stat().st_size
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if size <= 0 or size != record['bytes'] or digest != record['sha256']:
                  sys.exit(f'Release verification failed for {name}')
              print(f'{digest}  {name}  ({size} bytes)')
          PY
          MTOOLS_SKIP_CHECK=1 mdir -i "$release/droidvm-disk.img" \
            ::/EFI/BOOT/BOOTAA64.EFI ::/EFI/UniXNU/Payloads/DarwinBoot.efi
          cp "$release/release.json" diagnostics/release.json
          df -h / /private/tmp
          tar -czf - -C "$release" release.json droidvm-disk.img kernel.macho os.img systemos.img \
            -C "$RUNNER_TEMP" unique-chip-id.txt | \
            age --encrypt --recipient "$EXPORT_RECIPIENT" -o "$RUNNER_TEMP/unixnu-release.tar.gz.age"
          shasum -a 256 "$RUNNER_TEMP/unixnu-release.tar.gz.age"

      - name: Upload encrypted release
        if: ${{ success() && env.STAGE == 'images' }}
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-release-encrypted-${{ github.run_number }}
          path: ${{ runner.temp }}/unixnu-release.tar.gz.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save diagnostics and disk report
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          shopt -s nullglob
          for log in UniXNU/out/droidvm/tree/.cache/mesa-tu-*.log; do
            cp "$log" diagnostics/
          done
          if [[ -d UniXNU/out/droidvm/tree/build/turnip-darwin-host ]]; then
            mkdir -p diagnostics/turnip-host
            for log in UniXNU/out/droidvm/tree/build/turnip-darwin-host/*.log; do
              cp "$log" diagnostics/turnip-host/
            done
          fi
          {
            echo "stage=$STAGE"
            echo "runner=$RUNNER_OS"
            echo "date=$(date -u +%FT%TZ)"
            df -h / /private/tmp
            du -sh UniXNU/out/droidvm 2>/dev/null || true
            du -sh UniXNU/out/ipsw 2>/dev/null || true
          } > diagnostics/storage.txt
          if [ -d UniXNU/out/droidvm/build-all ]; then
            find UniXNU/out/droidvm/build-all -maxdepth 2 -type f -name '*.done' -print | sort > diagnostics/completed-steps.txt
          fi
          {
            echo "## UniXNU staged build"
            echo "- Selected step: \`$STAGE\`"
            echo "- Source branch: \`wip/hackintosh\`"
            echo ""
            echo "### Disk after build"
            printf '%s\n' '```'
            cat diagnostics/storage.txt
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-build-logs-${{ github.run_number }}
          path: |
            diagnostics/
            UniXNU/out/droidvm/build-all/logs/
            UniXNU/out/droidvm/logs/
          if-no-files-found: warn
          retention-days: 14
