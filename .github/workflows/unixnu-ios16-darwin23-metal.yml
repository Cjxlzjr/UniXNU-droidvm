name: UniXNU iOS 16 Darwin 23 Metal experiment

on:
  push:
    branches: [experiment/ios16-darwin23-metal, experiment/ios16-darwin23-metal-4-parallel, experiment/ios16-darwin23-metal-ci33, experiment/ios16-darwin23-metal-ci34, experiment/ios16-darwin23-metal-ci47-macos15, experiment/ios16-darwin23-metal-ci47-xcode27]
  workflow_dispatch:
    inputs:
      gpu_stage:
        description: '3d = VirtIO 3D self-test without Metal; metal = full plugin build'
        type: choice
        options: [3d, metal]
        default: metal

permissions:
  contents: read
  actions: read

concurrency:
  group: ios16-darwin23-metal-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REVISION: dba62c1ca53cd04c25b0e501afff31d5ffe2e20e
  EXPORT_RECIPIENT: age16wv2hcp4sktjexht8je05qwneyq2ddsxwt4nzhy90tz4h7zs0d3sftv9gs
  BUILD_DIR: UniXNU/out-ios16-darwin23-metal
  EFI_DIR: ios16-efi
  GPU_STAGE: ${{ inputs.gpu_stage || 'metal' }}

jobs:
  build:
    runs-on: ${{ github.ref_name == 'experiment/ios16-darwin23-metal-ci47-macos15' && 'macos-15' || github.ref_name == 'experiment/ios16-darwin23-metal-ci34' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.3 on macOS 15
        if: github.ref_name == 'experiment/ios16-darwin23-metal-ci47-macos15'
        shell: bash
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$developer_dir"
          sudo xcode-select --switch "$developer_dir"
      - name: Validate isolated experiment scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          python3 -m py_compile device/ios16/build-darwin23.py device/ios16/metal-experiment.py device/ios16/metal-trust.py device/ios16/host_check_integration.py device/scripts/check-turnip-darwin-host.py device/scripts/hostsim_watchdog_patch.py device/ios16/ci33-extension-overlay.py
          python3 device/ios16/ci33-extension-overlay.py selftest
          python3 device/ios16/metal-experiment.py selftest
          python3 device/ios16/metal-trust.py --selftest
          python3 device/ios16/host_check_integration.py
          python3 device/scripts/hostsim_watchdog_patch.py --selftest
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror device/ios16/test-ios16-swap-record.cpp -o "$RUNNER_TEMP/test-ios16-swap-record"
          "$RUNNER_TEMP/test-ios16-swap-record"
          test "$GPU_STAGE" = metal -o "$GPU_STAGE" = 3d
      - name: Install pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm lld cmake ninja unifdef mtools dtc age openssl@3 bison flex glslang vulkan-headers shaderc spirv-tools
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          command -v glslc || {
            echo '::error::Missing glslc from shaderc, required by the Turnip host smoke test'; exit 1;
          }
          glslc --version
          command -v spirv-val || {
            echo '::error::Missing spirv-val from spirv-tools'; exit 1;
          }
          printf '%s\n' '#version 450' 'void main() { gl_Position = vec4(0.0); }' | \
            glslc -fshader-stage=vert - -o "$RUNNER_TEMP/ios16-ci.spv"
          spirv-val "$RUNNER_TEMP/ios16-ci.spv"
          # check-turnip-darwin-host.py compiles vulkan_smoke.c with -I /opt/homebrew/include.
          test -f /opt/homebrew/include/vulkan/vulkan.h || {
            echo '::error::Missing Vulkan headers required by Turnip host smoke test'; exit 1;
          }
          printf '%s\n' '#include <vulkan/vulkan.h>' | \
            xcrun clang -I /opt/homebrew/include -Werror -x c -fsyntax-only -
          if [[ "$GPU_STAGE" == metal ]]; then
            command -v rustup || { echo '::error::rustup missing on macOS runner'; exit 1; }
            rustup toolchain install 1.98.0 --profile minimal
            rustup target add aarch64-apple-ios --toolchain 1.98.0
            printf '%s\n' '#![no_std]' 'pub fn probe() -> u32 { core::mem::size_of::<u64>() as u32 }' | \
              IPHONEOS_DEPLOYMENT_TARGET=16.0 rustc +1.98.0 --crate-name ios16_ci_probe --crate-type lib \
                --target aarch64-apple-ios --emit=obj -o "$RUNNER_TEMP/ios16-ci.o" -
          fi
          git clone --filter=blob:none --branch wip/hackintosh https://github.com/Droid-VM/UniXNU.git UniXNU
          git -C UniXNU checkout --detach "$CORE_REVISION"
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          xcodebuild -version
      - name: Reuse verified SMP EFI loaders
        uses: actions/download-artifact@v4
        with:
          name: ios16-efi
          run-id: 44771150733
          github-token: ${{ github.token }}
          path: ios16-efi
      - name: Configure isolated iOS16 experiment tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 device/ios16/build-darwin23.py configure --gpu-stage "$GPU_STAGE" --unixnu UniXNU --output "$BUILD_DIR" --efi-dir "$EFI_DIR" 2>&1 | tee diagnostics/configure.log
          python3 device/ios16/check-mach-inherited-ports.py "$BUILD_DIR/droidvm/tree/refer/xnu" 2>&1 | tee diagnostics/mach-inherited-ports.log
          if [[ "$GPU_STAGE" == metal ]]; then
            patch="$BUILD_DIR/droidvm/tree/patches/xnu/zzy-native-gpu-addon-mount.patch"
            test -f "$patch"
            grep -q 'native_gpu_addon_ext_post_owner' "$patch"
            grep -q 'native_gpu_addon_ext_pre_a11' "$patch"
            grep -q 'native_gpu_addon_ext_selected_lower' "$patch"
            cp "$patch" diagnostics/ci33-extensions-applied.patch
          fi
      - name: Build iOS16 kernel, Data seed and optional signed Metal plugin
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADRENO_METAL_REPLAY: '0'
        run: |
          set -euo pipefail
          diagnose_failure() {
            local result=$?
            trap - EXIT
            if [[ "$result" -ne 0 ]]; then
              for name in turnip-host-check.log plugin.log turnip-ios.log turnip-host.log; do
                file="$BUILD_DIR/droidvm/build-all/logs/$name"
                if [[ -s "$file" ]]; then
                  echo "::group::$name (last 100 lines)"
                  tail -n 100 "$file"
                  echo "::endgroup::"
                fi
              done
            fi
            exit "$result"
          }
          trap diagnose_failure EXIT
          python3 device/ios16/build-darwin23.py kernel --gpu-stage "$GPU_STAGE" --unixnu UniXNU --output "$BUILD_DIR" --efi-dir "$EFI_DIR" 2>&1 | tee diagnostics/kernel-metal.log
      - name: Verify actual pinned Extensions and Metal Data Seed before payload
        if: env.GPU_STAGE == 'metal'
        shell: bash
        run: |
          set -euo pipefail
          python3 device/ios16/check-metal-layout.py volumes \
            --volumes-dir "$BUILD_DIR/droidvm/iphone-volumes" \
            --out diagnostics/metal-layout.json 2>&1 | tee diagnostics/metal-layout.log
          python3 device/ios16/check-metal-layout.py seed \
            --core "$BUILD_DIR/droidvm/tree" \
            --seed "$BUILD_DIR/droidvm/tree/build/droidvm-data/data-2g-skip-metal.dbr" \
            --out diagnostics/metal-seed.json 2>&1 | tee diagnostics/metal-seed.log
      - name: Audit iOS16 plugin and original Apple trust modules
        if: env.GPU_STAGE == 'metal'
        shell: bash
        run: |
          set -euo pipefail
          plugin="$BUILD_DIR/droidvm/tree/build/adreno-metal-plugin"
          python3 device/ios16/metal-experiment.py audit "$plugin" 2>&1 | tee diagnostics/plugin-ios16-mach-o.json
          cp "$plugin/trust.json" diagnostics/plugin-trust.json
          cp "$BUILD_DIR/droidvm/tree/build/ios16-metal/owner-trust.json" diagnostics/owner-trust.json
          cp "$BUILD_DIR/droidvm/tree/build/ios16-metal/deployment-anchors.json" diagnostics/deployment-anchors.json
      - name: Assemble and verify isolated FAT boot disk
        shell: bash
        run: |
          set -euo pipefail
          python3 device/ios16/build-darwin23.py payload --gpu-stage "$GPU_STAGE" --unixnu UniXNU --output "$BUILD_DIR" --efi-dir "$EFI_DIR" 2>&1 | tee diagnostics/payload.log
          cp "$BUILD_DIR/droidvm/release/release.json" diagnostics/release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("diagnostics/release.json").read_text())
          assert report["gpu_stage"] in ("3d","metal")
          assert report["fat"]["kernel.macho"]["sha256"]
          if report["gpu_stage"]=="metal":
              assert report["gpu_plugin"]["cdhash"] and report["fat"]["kernel.macho.trustcache"]["sha256"] == report["trust_cache_sha256"]
          print("PASS: isolated experiment FAT members, trusted plugin metadata and original volume identity")
          PY
          tar -czf - -C "$BUILD_DIR/droidvm/release" ios16-darwin23.img release.json | \
            age --encrypt --recipient "$EXPORT_RECIPIENT" -o "$RUNNER_TEMP/ios16-darwin23-$GPU_STAGE.tar.gz.age"
      - uses: actions/upload-artifact@v4
        with:
          name: ios16-darwin23-${{ env.GPU_STAGE }}-encrypted
          path: ${{ runner.temp }}/ios16-darwin23-${{ env.GPU_STAGE }}.tar.gz.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-darwin23-metal-build-logs
          path: |
            diagnostics/
            UniXNU/out-ios16-darwin23-metal/droidvm/logs/
            UniXNU/out-ios16-darwin23-metal/droidvm/build-all/logs/
            UniXNU/out-ios16-darwin23-metal/droidvm/tree/build/turnip-darwin-host/*.log
            UniXNU/out-ios16-darwin23-metal/droidvm/tree/build/ui-shader-coverage/turnip-graphics/last-*.log
            UniXNU/out-ios16-darwin23-metal/droidvm/tree/build/priming-cache/*.log
            UniXNU/out-ios16-darwin23-metal/droidvm/tree/.cache/mesa-tu-*-build.log
            UniXNU/out-ios16-darwin23-metal/droidvm/tree/build/adreno-metal-bridge/ios/build-ios.log
          if-no-files-found: ignore
          retention-days: 7
